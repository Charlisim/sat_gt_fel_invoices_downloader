[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sat_gt_fel_invoices_downloader"
version = "0.6.0"
description = "Download received and issued FEL invoices from Guatemala's SAT."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Simon", email = "dev@csimon.dev" }]
dependencies = [
    "requests>=2.34.2,<3",
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1.3,<7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/Charlisim/sat_gt_fel_invoices_downloader"
Issues = "https://github.com/Charlisim/sat_gt_fel_invoices_downloader/issues"
Changelog = "https://github.com/Charlisim/sat_gt_fel_invoices_downloader/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "build>=1.6,<2", "twine>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
